{% extends "admin/layout/base_admin.html" %}

{% block content %}
<h3 class="fw-bold mb-4">Edit Category</h3>

<form method="POST" enctype="multipart/form-data"
      class="p-4"
      style="background:#161b22; border-radius:10px; color:#e6edf3; max-width:700px;">

    <!-- CATEGORY NAME -->
    <div class="mb-3">
        <label class="form-label">Category Name</label>
        <input type="text"
               name="name"
               class="form-control"
               value="{{ category.name }}"
               required>
    </div>

    <!-- CURRENT IMAGE -->
    <div class="mb-3">
        <label class="form-label">Current Image</label>

        {% if category.image %}
            <img src="{{ url_for('static', filename='uploads/categories/' ~ category.image) }}"
                 class="mt-2 rounded shadow-sm"
                 style="
                    width:100%;
                    max-height:220px;
                    object-fit:cover;
                    border:1px solid #30363d;
                 ">
        {% else %}
            <p class="text-muted">No image uploaded</p>
        {% endif %}
    </div>

    <!-- UPLOAD NEW IMAGE -->
    <div class="mb-3">
        <label class="form-label">Upload New Image</label>
        <input type="file"
               name="image"
               class="form-control"
               id="newImgInput"
               accept="image/*">

        <!-- LIVE PREVIEW OF NEW IMAGE -->
        <img id="newPreview"
             class="mt-3 rounded shadow-sm"
             style="
                display:none;
                width:100%;
                max-height:220px;
                object-fit:cover;
                border:1px solid #30363d;
                transition:0.3s ease-in-out;
             ">
    </div>

    <!-- SUBMIT -->
    <button class="btn btn-warning px-4">
        <i class="bi bi-pencil"></i> Update Category
    </button>

</form>

<!-- LIVE PREVIEW SCRIPT -->
<script>
    const newInput = document.getElementById("newImgInput");
    const newPreview = document.getElementById("newPreview");

    newInput.addEventListener("change", () => {
        const file = newInput.files[0];
        if (file) {
            newPreview.src = URL.createObjectURL(file);
            newPreview.style.display = "block";
        }
    });
</script>

{% endblock %}

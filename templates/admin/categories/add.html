{% extends "admin/layout/base_admin.html" %}

{% block content %}

<h3 class="fw-bold mb-4">Add New Category</h3>

<form method="POST" enctype="multipart/form-data"
      class="p-4"
      style="background:#161b22; border-radius:10px; color:#e6edf3; max-width:700px;">

    <!-- CATEGORY NAME -->
    <div class="mb-3">
        <label class="form-label">Category Name</label>
        <input type="text"
               name="name"
               class="form-control"
               placeholder="e.g., Sarees, Ethnic Wear, Cosmetics"
               required>
    </div>

    <!-- CATEGORY IMAGE UPLOAD -->
    <div class="mb-3">
        <label class="form-label">Upload Category Image</label>
        <input type="file"
               name="image"
               class="form-control"
               id="imgInput"
               accept="image/*">

        <!-- LIVE PREVIEW -->
        <img id="previewImage"
             class="mt-3 rounded shadow-sm"
             style="
                display:none;
                width:100%;
                max-height:220px;
                object-fit:cover;
                border:1px solid #30363d;
                transition:0.3s ease-in-out;
             ">
    </div>

    <!-- SUBMIT BUTTON -->
    <button class="btn btn-primary px-4">
        <i class="bi bi-save"></i> Create Category
    </button>

</form>

<!-- LIVE IMAGE PREVIEW SCRIPT -->
<script>
    const input = document.getElementById("imgInput");
    const preview = document.getElementById("previewImage");

    input.addEventListener("change", () => {
        const file = input.files[0];
        if (file) {
            preview.src = URL.createObjectURL(file);
            preview.style.display = "block";
        }
    });
</script>

{% endblock %}

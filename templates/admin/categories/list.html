{% extends "admin/layout/base_admin.html" %}

{% block content %}

<div class="container-fluid">

    <!-- Header Row -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold">Categories</h3>
        <a href="{{ url_for('admin_category.add_category') }}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Add Category
        </a>
    </div>

    <!-- Category Grid -->
    <div class="row g-4">

        {% for c in categories %}
        <div class="col-md-4 col-lg-3">
            <div class="card border-0 shadow-sm"
                 style="background:#161b22; color:#e6edf3; border-radius:10px; overflow:hidden;">

                <!-- CATEGORY IMAGE -->
                {% if c.image %}
                    <img src="{{ url_for('static', filename='uploads/categories/' ~ c.image) }}"
                         class="w-100"
                         style="
                            height:200px;
                            object-fit:cover;
                            border-bottom:1px solid #30363d;
                         ">
                {% else %}
                    <div style="
                            height:200px;
                            background:#21262d;
                            border-bottom:1px solid #30363d;"
                         class="d-flex align-items-center justify-content-center text-muted">
                        No Image
                    </div>
                {% endif %}

                <!-- CATEGORY BODY -->
                <div class="card-body">

                    <h5 class="card-title mb-1">{{ c.name }}</h5>
                    <p class="text-muted small mb-3">{{ c.slug }}</p>

                    <div class="d-flex justify-content-between">

                        <!-- EDIT -->
                        <a href="{{ url_for('admin_category.edit_category', id=c._id) }}"
                           class="btn btn-sm btn-warning px-3">
                            <i class="bi bi-pencil"></i> Edit
                        </a>

                        <!-- DELETE -->
                        <a href="{{ url_for('admin_category.delete_category', id=c._id) }}"
                           class="btn btn-sm btn-danger px-3"
                           onclick="return confirm('Delete this category?');">
                            <i class="bi bi-trash"></i> Delete
                        </a>

                    </div>
                </div>

            </div>
        </div>
        {% endfor %}

    </div>
</div>

{% endblock %}

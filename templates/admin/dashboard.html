{% extends "admin/layout/base_admin.html" %}

{% block content %}
<div class="container-fluid">

    <!-- PAGE TITLE -->
    <h2 class="mb-4">Dashboard</h2>

    <!-- ======================= STATS ROW ======================= -->
    <div class="row g-4">

        <!-- TOTAL USERS / CUSTOMERS -->
        <div class="col-md-3">
            <div class="p-4 rounded" style="background:#161b22; border:1px solid #30363d;">
                <div class="d-flex align-items-center">
                    <div class="me-3">
                        <i class="bi bi-people" style="font-size:36px; color:#58a6ff;"></i>
                    </div>
                    <div>
                        <h6 class="mb-1">Total Users</h6>
                        <h3 class="fw-bold">{{ total_customers }}</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- TOTAL CATEGORIES -->
        <div class="col-md-3">
            <div class="p-4 rounded" style="background:#161b22; border:1px solid #30363d;">
                <div class="d-flex align-items-center">
                    <div class="me-3">
                        <i class="bi bi-grid" style="font-size:36px; color:#ffa657;"></i>
                    </div>
                    <div>
                        <h6 class="mb-1">Total Categories</h6>
                        <h3 class="fw-bold">{{ total_categories }}</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- TOTAL PRODUCTS -->
        <div class="col-md-3">
            <div class="p-4 rounded" style="background:#161b22; border:1px solid:#30363d;">
                <div class="d-flex align-items-center">
                    <div class="me-3">
                        <i class="bi bi-box-seam" style="font-size:36px; color:#58a6ff;"></i>
                    </div>
                    <div>
                        <h6 class="mb-1">Total Products</h6>
                        <h3 class="fw-bold">{{ total_products }}</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- TOTAL ORDERS -->
        <div class="col-md-3">
            <div class="p-4 rounded" style="background:#161b22; border:1px solid:#30363d;">
                <div class="d-flex align-items-center">
                    <div class="me-3">
                        <i class="bi bi-receipt" style="font-size:36px; color:#ffa657;"></i>
                    </div>
                    <div>
                        <h6 class="mb-1">Total Orders</h6>
                        <h3 class="fw-bold">{{ total_orders }}</h3>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- ======================= QUICK ACTIONS ======================= -->
    <h4 class="mt-5 mb-3">Quick Shortcuts</h4>

    <div class="row g-4">

        <!-- PRODUCTS -->
        <div class="col-md-3">
            <a href="{{ url_for('admin_product.list_products') }}" class="text-decoration-none text-light">
                <div class="p-4 rounded text-center" style="background:#21262d; border:1px solid #30363d;">
                    <i class="bi bi-box-seam" style="font-size:32px; color:#58a6ff;"></i>
                    <h6 class="mt-2">Manage Products</h6>
                </div>
            </a>
        </div>

        <!-- CATEGORIES -->
        <div class="col-md-3">
            <a href="{{ url_for('admin_category.list_categories') }}" class="text-decoration-none text-light">
                <div class="p-4 rounded text-center" style="background:#21262d; border:1px solid #30363d;">
                    <i class="bi bi-grid" style="font-size:32px; color:#58a6ff;"></i>
                    <h6 class="mt-2">Manage Categories</h6>
                </div>
            </a>
        </div>

        <!-- ADS MANAGER REMOVED -->
        <!-- (No code added here — simply deleted as requested) -->

        <!-- LOGOUT -->
        <div class="col-md-3">
            <a href="#" data-bs-toggle="modal" data-bs-target="#logoutModal" class="text-decoration-none text-light">
                <div class="p-4 rounded text-center" style="background:#21262d; border:1px solid #30363d;">
                    <i class="bi bi-box-arrow-right" style="font-size:32px; color:#da3633;"></i>
                    <h6 class="mt-2">Logout</h6>
                </div>
            </a>
        </div>

    </div>

</div>
{% endblock %}

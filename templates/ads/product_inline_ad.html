{# templates/ads/product_inline_ad.html — product-style inline ad #}

{% if ad %}
<div class="col-6 col-md-3">
    <div class="card product-card h-100 position-relative shadow-sm hover-lift">

        <!-- Product-like image container (3:4 ratio) -->
        <div style="
            width:100%;
            position:relative;
            padding-top:135%;
            overflow:hidden;
            border-radius:12px;
        ">
            <a href="{{ ad.get('redirect_url') or '#' }}"
               target="_blank"
               class="tt-ad-inline-prod-link"
               data-campaign-id="{{ ad.get('campaign_id') }}"
               data-slot-id="{{ ad.get('slot_id') }}"
               style="
                    display:block;
                    width:100%;
                    height:100%;
                    position:absolute;
                    inset:0;
                ">

                <img src="{{ ad.get('image_url') }}"
                     alt="{{ ad.get('headline') or 'Sponsored' }}"
                     loading="lazy"
                     class="tt-ad-inline-prod-img"
                     style="
                        width:100%;
                        height:100%;
                        object-fit:cover;
                        display:block;
                        border-radius:12px;
                     ">
            </a>
        </div>

        <!-- Optional advertiser headline -->
        {% if ad.get('headline') %}
        <div class="p-2">
            <h6 class="mb-0 fw-semibold text-truncate" style="font-size:14px;">
                {{ ad.get('headline') }}
            </h6>
        </div>
        {% endif %}

    </div>
</div>

<script>
(function () {
    try {
        // ⭐ Always track against Dcorp backend
        const root = "http://127.0.0.1:5000";

        const wrap = document.currentScript.previousElementSibling;
        if (!wrap) return;

        const link = wrap.querySelector(".tt-ad-inline-prod-link");
        const img  = wrap.querySelector(".tt-ad-inline-prod-img");

        if (!link) return;

        // Correct dataset attributes
        const campaignId = link.dataset.campaignId || null;
        const slotId     = link.dataset.slotId || null;

        if (!campaignId || !slotId) return;

        // -----------------------------
        // IMPRESSION TRACKING
        // -----------------------------
        function sendImpression() {
            fetch(`${root}/api/ads/track/impression`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    campaign_id: campaignId,
                    slot_id: slotId
                })
            }).catch(() => {});
        }

        img.complete
            ? sendImpression()
            : img.addEventListener("load", sendImpression);

        // -----------------------------
        // CLICK TRACKING
        // -----------------------------
        link.addEventListener("click", () => {
            fetch(`${root}/api/ads/track/click`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    campaign_id: campaignId,
                    slot_id: slotId
                })
            }).catch(() => {});
        });

    } catch (err) {
        console.error("product_inline_ad tracking error:", err);
    }
})();
</script>

{% endif %}
